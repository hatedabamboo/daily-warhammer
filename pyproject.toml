[project]
name = "daily-warhammer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "atproto>=0.0.54",
]

[dependency-groups]
dev = [
    "boto3>=1.34.0",
    "boto3-stubs[dynamodb]>=1.34.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
